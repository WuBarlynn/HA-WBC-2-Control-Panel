<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>开机卡控制台 · HA-WBC-2</title>

<link rel="stylesheet" href="style.css?v=1.3.2">
</head>
<body>

  <symbol id="i-power" viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></symbol>
  <symbol id="i-restart" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M5 13a10 10 0 0 1 14 0"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 20 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-chip" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M9 2v3"/><path d="M15 2v3"/><path d="M9 19v3"/><path d="M15 19v3"/><path d="M2 9h3"/><path d="M2 15h3"/><path d="M19 9h3"/><path d="M19 15h3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-key" viewBox="0 0 24 24"><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5"/></symbol>
  <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M14 14.76V5a4 4 0 0 0-8 0v9.76a6 6 0 1 0 8 0z"/><line x1="10" y1="9" x2="10" y2="17"/></symbol>
</svg>

<!-- 登录 / 初始化 -->
<div id="view-auth" class="auth-view hidden">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-mark"><svg class="icon"><use href="#i-power"/></svg></span>
      <div class="logo-text">
        <b>开机卡控制台</b>
        <span>HA-WBC-2 局域网控制系统</span>
      </div>
    </div>
    <h1 id="auth-title">登录</h1>
    <p class="muted" id="auth-sub">请输入管理员密码</p>
    <form id="auth-form" autocomplete="off">
      <div class="field">
        <label for="auth-password">管理员密码</label>
        <input type="password" id="auth-password" minlength="6" required placeholder="请输入密码">
      </div>
      <div class="field hidden" id="auth-confirm-wrap">
        <label for="auth-confirm">确认密码</label>
        <input type="password" id="auth-confirm" placeholder="请再次输入密码">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="auth-submit">登 录</button>
    </form>
    <div class="divider hidden" id="pk-divider"><span>或</span></div>
    <button type="button" class="btn btn-block hidden" id="btn-passkey-login">
      <svg class="icon"><use href="#i-key"/></svg>使用通行密钥登录
    </button>
    <p class="pk-hint hidden" id="pk-unavailable"></p>
  </div>
  <p class="auth-foot muted">数据仅保存在本机 · 通过局域网直连开机卡</p>
</div>

<!-- 主界面 -->
<div id="view-app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo-mark"><svg class="icon"><use href="#i-power"/></svg></span>
      <div class="logo-text">
        <b>开机卡控制台</b>
        <span>HA-WBC-2</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn-icon" id="btn-theme" title="切换主题"><svg class="icon"><use href="#i-moon"/></svg></button>
      <button class="btn-icon" id="btn-settings" title="系统设置"><svg class="icon"><use href="#i-gear"/></svg></button>
      <button class="btn-icon" id="btn-logout" title="退出登录"><svg class="icon"><use href="#i-logout"/></svg></button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h2>设备总览</h2>
        <p class="muted" id="summary-line">正在加载...</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost" id="btn-refresh"><svg class="icon"><use href="#i-restart"/></svg>刷新</button>
        <button class="btn btn-primary" id="btn-add"><svg class="icon"><use href="#i-plus"/></svg>添加开机卡</button>
      </div>
    </div>

    <div id="device-grid" class="grid"></div>

    <div id="empty-state" class="empty hidden">
      <div class="empty-icon"><svg class="icon"><use href="#i-chip"/></svg></div>
      <h3>还没有开机卡</h3>
      <p class="muted">添加局域网内的 HA-WBC-2 开机卡,即可远程控制主机电源</p>
      <button class="btn btn-primary" id="btn-add-empty"><svg class="icon"><use href="#i-plus"/></svg>添加第一张开机卡</button>
    </div>
  </main>
</div>

<!-- 设备详情抽屉 -->
<div id="drawer-mask" class="drawer-mask hidden"></div>
<aside id="drawer" class="drawer" aria-hidden="true">
  <div id="drawer-content"></div>
</aside>

<!-- 通用模态框 -->
<div id="modal-mask" class="modal-mask hidden">
  <div id="modal" class="modal" role="dialog"></div>
</div>

<!-- 通知 -->
<div id="toasts" class="toasts"></div>

<script src="app.js?v=1.3.2"></script>
</body>
</html>
